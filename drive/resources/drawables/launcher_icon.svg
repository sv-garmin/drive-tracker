<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- steering wheel: outer ring -->
  <circle cx="20" cy="20" r="14" stroke="#F4F4F4" stroke-width="3" fill="none"/>
  <!-- center hub -->
  <circle cx="20" cy="20" r="3.2" fill="#F4F4F4"/>
  <!-- three spokes: down, upper-left, upper-right -->
  <g stroke="#F4F4F4" stroke-width="3" stroke-linecap="round">
    <line x1="20" y1="23" x2="20" y2="32"/>
    <line x1="17.6" y1="18.4" x2="10" y2="14"/>
    <line x1="22.4" y1="18.4" x2="30" y2="14"/>
  </g>
</svg>
